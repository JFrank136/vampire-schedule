name: Bump current week

on:
  schedule:
    # Every Tuesday 11:00 UTC (~6-7am US Eastern depending on DST).
    - cron: '0 11 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-week:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/bump-week.js
      - run: |
          if git diff --quiet template.html; then
            echo "No change; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add template.html
          git commit -m "Advance current week (automated)"
          git push
