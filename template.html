<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Vampire Matchup Picker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f5f3ea;
    --surface: #ffffff;
    --surface-2: #ece5d3;
    --border: #dbd2ba;
    --text: #241c12;
    --text-2: #6b5d45;
    --accent: #2f5233;
    --accent-ink: #ffffff;
    --good: #3d7a45;
    --good-bg: #e5f0e3;
    --bad: #93412a;
    --bad-bg: #f5e7de;
    --warn: #9c6b1c;
    --warn-bg: #f4ead4;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17150f;
      --surface: #221e15;
      --surface-2: #2a2418;
      --border: #3d3423;
      --text: #f2eee3;
      --text-2: #b8ad97;
      --accent: #7fb885;
      --accent-ink: #0f1c10;
      --good: #8bc48f;
      --good-bg: #223327;
      --bad: #d99a80;
      --bad-bg: #3a2820;
      --warn: #e0b563;
      --warn-bg: #362b17;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17150f;
    --surface: #221e15;
    --surface-2: #2a2418;
    --border: #3d3423;
    --text: #f2eee3;
    --text-2: #b8ad97;
    --accent: #7fb885;
    --accent-ink: #0f1c10;
    --good: #8bc48f;
    --good-bg: #223327;
    --bad: #d99a80;
    --bad-bg: #3a2820;
    --warn: #e0b563;
    --warn-bg: #362b17;
  }

  * { box-sizing: border-box; }
  body {
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 880px;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 4rem;
  }
  h3, h4 { font-family: 'Oswald', 'IBM Plex Sans', sans-serif; font-weight: 500; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text); margin: 1.75rem 0 0.6rem; }
  h3:first-child { margin-top: 0; }

  .tabs { display: flex; gap: 4px; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
  .tab {
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 10px 16px;
    cursor: pointer;
    border: none;
    background: none;
    font-size: 13px;
    color: var(--text-2);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .panel { display: none; }
  .panel.active { display: block; }

  textarea {
    width: 100%; height: 140px; font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px;
  }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .row {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 8px;
  }
  .row.ineligible { opacity: 0.6; }
  .row.top { border-left-color: var(--accent); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-2); font-family: 'Oswald', sans-serif; font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: 0.04em; }

  .bye { color: var(--bad); font-size: 12px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--bad-bg); color: var(--bad); font-weight: 500; }

  button {
    cursor: pointer; padding: 7px 14px; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; font-weight: 500;
    background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  #app > .panel button[id^="save-"], #generate-schedule {
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
  }
  #app > .panel button[id^="save-"]:hover, #generate-schedule:hover { opacity: 0.9; color: var(--accent-ink); }

  input[type=number], input[type=text], select {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px;
    background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px;
  }
  input[type=number] { width: 64px; }
  label { font-size: 13px; color: var(--text-2); margin-right: 8px; }
  .field { margin-bottom: 10px; display: flex; align-items: center; gap: 4px; }
  p[id$="-status"] { font-size: 13px; color: var(--text-2); min-height: 1.2em; }

  #week-label { font-family: 'Oswald', sans-serif; font-size: 18px; letter-spacing: 0.03em; margin: 0 8px; }
  #week-prev, #week-next { padding: 6px 10px; }
  #window-badge:not(:empty) {
    display: inline-block; margin-left: 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em;
    background: var(--warn-bg); color: var(--warn); padding: 3px 9px; border-radius: 999px; font-family: 'IBM Plex Sans', sans-serif; font-weight: 500;
  }
  #own-score { background: var(--surface-2); border-left-color: var(--accent); margin-bottom: 1.25rem; }
</style>
</head>
<body>
<div id="app">
  <div class="tabs">
    <button class="tab active" data-tab="setup">Setup</button>
    <button class="tab" data-tab="picker">Weekly picker</button>
    <button class="tab" data-tab="overview">Season overview</button>
  </div>

  <div class="panel active" id="panel-setup">
    <h3>Rosters CSV</h3>
    <textarea id="rosters-input" placeholder="Paste rosters.csv contents here"></textarea>
    <button id="save-rosters">Save rosters</button>
    <p id="rosters-status"></p>

    <h3>DraftSharks CSV</h3>
    <textarea id="draftsharks-input" placeholder="Paste DraftSharks CSV contents here"></textarea>
    <button id="save-draftsharks">Save DraftSharks data</button>
    <p id="draftsharks-status"></p>

    <h3>Settings</h3>
    <div class="field"><label>Last regular season week</label><input type="number" id="setting-last-week" value="14"></div>
    <div class="field"><label>Restricted window start</label><input type="number" id="setting-window-start" value="5"></div>
    <div class="field"><label>Restricted window end</label><input type="number" id="setting-window-end" value="13"></div>
    <div class="field"><label>Max meetings per opponent</label><input type="number" id="setting-max-meetings" value="2"></div>
    <button id="save-settings">Save settings</button>
    <p id="settings-status"></p>
  </div>

  <div class="panel" id="panel-picker">
    <div class="field">
      <button id="week-prev">&larr;</button>
      <strong id="week-label">Week 1</strong>
      <button id="week-next">&rarr;</button>
      <span id="window-badge"></span>
    </div>
    <div id="own-score" class="row"></div>
    <div id="opponent-list"></div>
  </div>

  <div class="panel" id="panel-overview">
    <button id="generate-schedule">Generate / refresh season schedule</button>
    <table id="overview-table">
      <thead><tr><th>Week</th><th>Opponent</th><th>Status</th><th>Result</th><th>Note</th></tr></thead>
      <tbody></tbody>
    </table>
    <h4>Meetings so far</h4>
    <table id="meetings-table">
      <thead><tr><th>Team</th><th>Times played</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
/* LOGIC_INJECTION_POINT */
</script>
<script>
(function () {
  const state = {
    rosters: {},
    draftsharks: {},
    settings: { lastRegularSeasonWeek: 14, restrictedWindowStart: 5, restrictedWindowEnd: 13, maxMeetingsPerOpponent: 2 },
    scheduleWeeks: [],
    currentWeek: 1,
    db: null,
  };

  function $(id) { return document.getElementById(id); }

  function esc(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach((el) => el.classList.toggle('active', el.dataset.tab === name));
    document.querySelectorAll('.panel').forEach((el) => el.classList.toggle('active', el.id === 'panel-' + name));
    if (name === 'picker') renderPicker();
    if (name === 'overview') renderOverview();
  }

  document.querySelectorAll('.tab').forEach((el) => {
    el.addEventListener('click', () => switchTab(el.dataset.tab));
  });

  function nonVampireTeams() {
    return Object.keys(state.rosters).filter((t) => t !== 'Me');
  }

  function renderPicker() {
    $('week-label').textContent = 'Week ' + state.currentWeek;
    $('window-badge').textContent = isRestrictedWeek(state.currentWeek, state.settings)
      ? 'restricted window · once each'
      : '';

    const me = state.rosters.Me || [];
    const myScore = teamWeekScore(me, state.draftsharks, state.currentWeek);
    $('own-score').innerHTML = '<div><div style="font-size:12px;color:#777">Your projected score (Me)</div>'
      + '<div style="font-size:22px;font-weight:600">' + myScore.toFixed(1) + '</div></div>';

    const teams = nonVampireTeams().map((team) => {
      const players = state.rosters[team] || [];
      const score = teamWeekScore(players, state.draftsharks, state.currentWeek);
      const breakdown = teamWeekBreakdown(players, state.draftsharks, state.currentWeek);
      const reason = ineligibilityReason(team, state.currentWeek, state.scheduleWeeks, state.settings);
      return { team, score, breakdown, reason };
    }).sort((a, b) => a.score - b.score);

    const topEligibleIndex = teams.findIndex((t) => !t.reason);

    const list = $('opponent-list');
    list.innerHTML = '';
    teams.forEach((entry, index) => {
      const row = document.createElement('div');
      row.className = 'row' + (entry.reason ? ' ineligible' : '') + (index === topEligibleIndex && !entry.reason ? ' top' : '');
      const byePlayers = entry.breakdown.filter((p) => p.onBye).map((p) => p.player).join(', ');
      const injured = entry.breakdown.filter((p) => p.injuryRisk !== null && p.injuryRisk >= 40);
      const margin = (myScore - entry.score).toFixed(1);

      const header = document.createElement('div');
      header.style.display = 'flex';
      header.style.justifyContent = 'space-between';
      header.style.width = '100%';
      header.innerHTML = '<span><strong>' + esc(entry.team) + '</strong>'
        + (byePlayers ? ' <span class="bye">bye: ' + esc(byePlayers) + '</span>' : '')
        + (injured.length ? ' <span class="badge">injury risk</span>' : '')
        + '</span>'
        + '<span>' + entry.score.toFixed(1) + ' ('
        + (entry.reason ? entry.reason : (margin >= 0 ? '+' : '') + margin + ' margin')
        + ')</span>';
      row.appendChild(header);

      const details = document.createElement('table');
      details.style.display = 'none';
      details.style.marginTop = '6px';
      details.innerHTML = '<tbody>' + entry.breakdown.map((p) => (
        '<tr><td>' + esc(p.slot) + '</td><td>' + esc(p.player) + '</td><td>' + p.value.toFixed(1) + '</td>'
        + '<td>' + (p.onBye ? 'bye' : '') + '</td></tr>'
      )).join('') + '</tbody>';
      row.appendChild(details);
      header.addEventListener('click', () => {
        details.style.display = details.style.display === 'none' ? 'block' : 'none';
      });

      if (!entry.reason) {
        const lockButton = document.createElement('button');
        lockButton.textContent = 'Lock in ' + entry.team;
        lockButton.addEventListener('click', (event) => {
          event.stopPropagation();
          lockWeek(state.currentWeek, entry.team);
        });
        row.appendChild(lockButton);
      }

      list.appendChild(row);
    });
  }

  function renderOverview() {
    const tbody = document.querySelector('#overview-table tbody');
    tbody.innerHTML = '';
    for (let week = 1; week <= state.settings.lastRegularSeasonWeek; week += 1) {
      const entry = state.scheduleWeeks.find((w) => w.week === week) || { opponent: null, locked: false, result: null, note: '' };
      const tr = document.createElement('tr');

      const weekCell = document.createElement('td');
      weekCell.textContent = week;
      const opponentCell = document.createElement('td');
      opponentCell.textContent = entry.opponent || '—';
      const statusCell = document.createElement('td');
      statusCell.textContent = entry.locked ? 'locked' : (entry.opponent ? 'tentative' : '');
      tr.appendChild(weekCell);
      tr.appendChild(opponentCell);
      tr.appendChild(statusCell);

      const resultCell = document.createElement('td');
      if (entry.locked) {
        const select = document.createElement('select');
        ['', 'W', 'L'].forEach((value) => {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = value || '—';
          if ((entry.result || '') === value) option.selected = true;
          select.appendChild(option);
        });
        select.addEventListener('change', () => {
          updateWeekResult(week, select.value || null, entry.note || '');
        });
        resultCell.appendChild(select);
      }
      tr.appendChild(resultCell);

      const noteCell = document.createElement('td');
      if (entry.locked) {
        const noteInput = document.createElement('input');
        noteInput.type = 'text';
        noteInput.style.width = '180px';
        noteInput.placeholder = 'e.g. stole M. Evans for J. Reed';
        noteInput.value = entry.note || '';
        noteInput.addEventListener('change', () => {
          updateWeekResult(week, entry.result || null, noteInput.value);
        });
        noteCell.appendChild(noteInput);
      }
      tr.appendChild(noteCell);

      tbody.appendChild(tr);
    }

    const counts = meetingCounts(state.scheduleWeeks);
    const meetingsBody = document.querySelector('#meetings-table tbody');
    meetingsBody.innerHTML = nonVampireTeams().map((team) => (
      '<tr><td>' + esc(team) + '</td><td>' + (counts[team] || 0) + '</td></tr>'
    )).join('');
  }

  function lockWeek(week, opponent) {
    const updated = { week, opponent, locked: true, result: null, note: '' };
    const existingIndex = state.scheduleWeeks.findIndex((w) => w.week === week);
    if (existingIndex >= 0) state.scheduleWeeks[existingIndex] = updated;
    else state.scheduleWeeks.push(updated);
    renderPicker();
    if (state.db) {
      state.db.collection('schedule').doc('week-' + week).set(updated)
        .catch(() => { console.error('Failed to lock week ' + week); });
    }
  }

  function updateWeekResult(week, result, note) {
    const index = state.scheduleWeeks.findIndex((w) => w.week === week);
    if (index < 0) return;
    const updated = { ...state.scheduleWeeks[index], result, note };
    state.scheduleWeeks[index] = updated;
    if (state.db) state.db.collection('schedule').doc('week-' + week).set(updated);
    renderOverview();
  }

  $('week-prev').addEventListener('click', () => {
    state.currentWeek = Math.max(1, state.currentWeek - 1);
    renderPicker();
  });
  $('week-next').addEventListener('click', () => {
    state.currentWeek = Math.min(state.settings.lastRegularSeasonWeek, state.currentWeek + 1);
    renderPicker();
  });

  $('save-rosters').addEventListener('click', () => {
    const parsed = parseRosters($('rosters-input').value);
    state.rosters = parsed;
    const teamCount = Object.keys(parsed).length;
    if (state.db) {
      $('rosters-status').textContent = 'Saving...';
      state.db.doc('data/rosters').set(parsed)
        .then(() => { $('rosters-status').textContent = 'Saved ' + teamCount + ' teams.'; })
        .catch(() => { $('rosters-status').textContent = 'Save failed - check your connection and try again.'; });
    } else {
      $('rosters-status').textContent = 'Saved ' + teamCount + ' teams (local only, no shared storage available).';
    }
  });

  $('save-draftsharks').addEventListener('click', () => {
    const parsed = parseDraftSharks($('draftsharks-input').value);
    state.draftsharks = parsed;
    const playerCount = Object.keys(parsed).length;
    if (state.db) {
      $('draftsharks-status').textContent = 'Saving...';
      state.db.doc('data/draftsharks').set(parsed)
        .then(() => { $('draftsharks-status').textContent = 'Saved ' + playerCount + ' players.'; })
        .catch(() => { $('draftsharks-status').textContent = 'Save failed - check your connection and try again.'; });
    } else {
      $('draftsharks-status').textContent = 'Saved ' + playerCount + ' players (local only, no shared storage available).';
    }
  });

  $('save-settings').addEventListener('click', () => {
    const settings = {
      lastRegularSeasonWeek: Number($('setting-last-week').value),
      restrictedWindowStart: Number($('setting-window-start').value),
      restrictedWindowEnd: Number($('setting-window-end').value),
      maxMeetingsPerOpponent: Number($('setting-max-meetings').value),
    };
    if (Object.values(settings).some((v) => Number.isNaN(v))) {
      $('settings-status').textContent = 'All settings must be numbers.';
      return;
    }
    state.settings = settings;
    if (state.db) {
      $('settings-status').textContent = 'Saving...';
      state.db.doc('data/settings').set(settings)
        .then(() => { $('settings-status').textContent = 'Settings saved.'; })
        .catch(() => { $('settings-status').textContent = 'Save failed - check your connection and try again.'; });
    } else {
      $('settings-status').textContent = 'Settings saved (local only, no shared storage available).';
    }
  });

  $('generate-schedule').addEventListener('click', () => {
    const teams = nonVampireTeams();
    const generated = generateSeasonSchedule(teams, state.settings, state.scheduleWeeks);
    state.scheduleWeeks = generated;
    if (state.db) {
      generated.forEach((entry) => {
        state.db.collection('schedule').doc('week-' + entry.week).set(entry);
      });
    }
    renderOverview();
  });

  async function init() {
    if (typeof claude === 'undefined' || !claude.use) {
      renderPicker();
      renderOverview();
      return;
    }
    const db = await claude.use('db');
    state.db = db;
    if (!db) {
      renderPicker();
      renderOverview();
      return;
    }

    db.doc('data/rosters').onSnapshot((snap) => {
      state.rosters = snap.exists ? snap.data() : {};
      renderPicker();
    });
    db.doc('data/draftsharks').onSnapshot((snap) => {
      state.draftsharks = snap.exists ? snap.data() : {};
      renderPicker();
    });
    db.doc('data/settings').onSnapshot((snap) => {
      if (snap.exists) state.settings = snap.data();
      renderPicker();
      renderOverview();
    });
    db.collection('schedule').onSnapshot((querySnap) => {
      state.scheduleWeeks = querySnap.docs.map((d) => d.data());
      renderPicker();
      renderOverview();
    });
  }

  init();
})();
</script>
</body>
</html>
