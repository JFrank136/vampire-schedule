<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vampire Matchup Picker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f5f3ea;
    --surface: #ffffff;
    --surface-2: #ece5d3;
    --border: #dbd2ba;
    --text: #241c12;
    --text-2: #6b5d45;
    --accent: #2f5233;
    --accent-ink: #ffffff;
    --good: #3d7a45;
    --good-bg: #e5f0e3;
    --bad: #93412a;
    --bad-bg: #f5e7de;
    --warn: #9c6b1c;
    --warn-bg: #f4ead4;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17150f;
      --surface: #221e15;
      --surface-2: #2a2418;
      --border: #3d3423;
      --text: #f2eee3;
      --text-2: #b8ad97;
      --accent: #7fb885;
      --accent-ink: #0f1c10;
      --good: #8bc48f;
      --good-bg: #223327;
      --bad: #d99a80;
      --bad-bg: #3a2820;
      --warn: #e0b563;
      --warn-bg: #362b17;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17150f;
    --surface: #221e15;
    --surface-2: #2a2418;
    --border: #3d3423;
    --text: #f2eee3;
    --text-2: #b8ad97;
    --accent: #7fb885;
    --accent-ink: #0f1c10;
    --good: #8bc48f;
    --good-bg: #223327;
    --bad: #d99a80;
    --bad-bg: #3a2820;
    --warn: #e0b563;
    --warn-bg: #362b17;
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: no-preference) {
    button, .tab, .card-lineup tbody tr, #roster-table tbody tr {
      transition: border-color 150ms ease, color 150ms ease, background-color 150ms ease, opacity 150ms ease;
    }
    .card-grid .card { animation: fade-in 200ms ease; }
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  body {
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 880px;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 4rem;
  }
  @media (min-width: 1100px) {
    /* Wide/desktop viewports get more room so the card grid can lay out
       several matchup cards per row instead of stacking narrowly. Mobile
       layout (the max-width:600px block below) is untouched. */
    body { max-width: 1400px; }
  }
  h3, h4 { font-family: 'Oswald', 'IBM Plex Sans', sans-serif; font-weight: 500; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text); margin: 1.75rem 0 0.6rem; }
  h3:first-child { margin-top: 0; }

  .tabs { display: flex; gap: 4px; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
  .tab {
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 10px 16px;
    cursor: pointer;
    border: none;
    border-radius: 0;
    background: none;
    font-size: 13px;
    color: var(--text-2);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .panel { display: none; }
  .panel.active { display: block; }

  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .card.ineligible { opacity: 0.6; }
  .card.locked-in { border-color: var(--good); }
  .card-top { padding: 12px 14px 8px; }
  .card-eyebrow { font-family: 'Oswald', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
  .card-name { font-family: 'Oswald', sans-serif; font-size: 17px; font-weight: 600; }
  .card-stats { display: flex; align-items: baseline; justify-content: space-between; margin-top: 6px; }
  .card-score { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .card-margin { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-variant-numeric: tabular-nums; }
  .card-margin.good { color: var(--good); }
  .card-margin.bad { color: var(--bad); }
  .card-strip { font-size: 12px; padding: 6px 14px; }
  .card-strip.bye { background: var(--warn-bg); color: var(--warn); }
  .card-strip.injury { background: var(--bad-bg); color: var(--bad); }
  .card-strip.ineligible { background: var(--surface-2); color: var(--text-2); font-style: italic; }
  .card-strip.locked-in { background: var(--good-bg); color: var(--good); font-weight: 500; }
  .card-lineup tbody tr[data-player] { cursor: pointer; }
  .card-lineup tbody tr.flag-good { background: var(--good-bg); }
  .card-lineup tbody tr.flag-injury { background: var(--warn-bg); }
  .card-lineup tbody tr.flag-bad { background: var(--bad-bg); }
  .card-footer { padding: 10px 14px 12px; }
  .card-footer button { width: 100%; }
  .card-lineup { margin: 0 14px 10px; width: calc(100% - 28px); }
  #weekly-viewer { margin-top: 2rem; }
  #weekly-viewer h3 { font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 4px; }
  .weekly-note { color: var(--text-2); font-size: 12px; margin: 4px 0 10px; }
  .fa-scroll { overflow-x: auto; }
  #fa-table tr.fa-mine td { background: var(--warn-bg); }
  #fa-table tr.fa-starter td:nth-child(2) { font-weight: 600; }
  #fa-table td.num, #fa-table th.num, #fa-lineup-table td.num, #fa-lineup-table th.num { text-align: right; }
  .fa-btn { font-size: 12px; padding: 3px 10px; }
  .fa-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 12px; }
  .fa-lineup-total td { font-weight: 600; border-top: 1px solid var(--border); }
  #weekly-table { border-collapse: separate; border-spacing: 0 6px; }
  #weekly-table th { padding-bottom: 2px; border-bottom: none; }
  .weekly-row { cursor: pointer; }
  .weekly-row td { background: var(--surface); border: 1px solid var(--border); border-left-width: 0; border-right-width: 0; padding: 10px 10px; font-weight: 500; }
  .weekly-row td:first-child { border-left-width: 1px; border-radius: var(--radius) 0 0 var(--radius); }
  .weekly-row td:last-child { border-right-width: 1px; border-radius: 0 var(--radius) var(--radius) 0; }
  .weekly-row.open td { background: var(--surface-2); border-bottom-color: transparent; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .weekly-row td.ds-cell, .weekly-row.open td.ds-cell { font-family: 'IBM Plex Mono', monospace; background: hsl(calc(120 - 120 * var(--t)) 60% 46% / 0.30); }
  .weekly-row .chev { display: inline-block; width: 1em; color: var(--text-2); }
  .weekly-row:hover td { border-color: var(--accent); }
  .bye-list { font-weight: 400; font-size: 12px; color: var(--text-2); }
  .weekly-detail td { padding: 0 0 6px 0; border: none; }
  .weekly-detail .detail-box { background: var(--surface-2); border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius) var(--radius); padding: 4px 14px 12px 28px; margin-top: -6px; }
  .weekly-detail table { margin: 0; width: 100%; }
  .weekly-detail th, .weekly-detail td { padding: 4px 6px; }
  .weekly-detail tbody tr:hover { background: none; }
  .weekly-detail .stand-in td { color: var(--text-2); font-style: italic; }
  .detail-bye { font-size: 12px; margin: 8px 0 0; color: var(--bad); }
  .fa-scroll table.fa-tight th, .fa-scroll table.fa-tight td { padding: 2px 8px; font-size: 12px; }
  .fa-scroll table.fa-tight .fa-btn { min-height: 0; padding: 1px 9px; font-size: 11px; }
  #fa-table th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  #fa-table th.sortable:hover { color: var(--text); }
  #fa-table th .arrow { display: inline-block; width: 0.9em; }
  .card-lineup th, .card-lineup td { font-size: 12px; padding: 5px 6px; }
  .card-lineup th { font-size: 10px; }
  .card-lineup-bench td { color: var(--text-2); font-style: italic; border-top: 1px solid var(--border); }

  /* Wide layout: fixed 3-up (2-up on tablets) grid. Each card spans four
     shared grid rows (header / strips / lineup / footer) via subgrid, so
     names, scores, tables and Lock buttons line up across a row even when
     some cards have an injury or locked strip and others don't. */
  .card-eyebrow.ph { display: none; }
  @media (min-width: 720px) {
    #opponent-list.card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: stretch; }
    #opponent-list .card { display: grid; grid-row: span 4; grid-template-rows: subgrid; row-gap: 0; }
    #opponent-list .card-strips { min-height: 0; }
    #opponent-list .card-footer { align-self: end; }
    .card-eyebrow, .card-eyebrow.ph { line-height: 14px; }
    .card-eyebrow.ph { display: block; min-height: 14px; }
    .card-lineup { table-layout: fixed; }
    .card-lineup th, .card-lineup td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-lineup th:nth-child(1), .card-lineup td:nth-child(1) { width: 14%; }
    .card-lineup th:nth-child(2), .card-lineup td:nth-child(2) { width: 34%; }
    .card-lineup th:nth-child(3), .card-lineup td:nth-child(3) { width: 12%; }
    .card-lineup th:nth-child(4), .card-lineup td:nth-child(4) { width: 10%; }
    .card-lineup th:nth-child(5), .card-lineup td:nth-child(5) { width: 14%; }
    .card-lineup th:nth-child(6), .card-lineup td:nth-child(6) { width: 16%; }
  }
  @media (min-width: 1100px) {
    #opponent-list.card-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-2); font-family: 'Oswald', sans-serif; font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: 0.04em; }
  tbody tr:hover { background: var(--surface-2); }

  #roster-table .roster-divider td {
    border-bottom: none; border-top: 2px solid var(--accent);
    padding-top: 10px; font-family: 'Oswald', sans-serif; font-size: 10px;
    font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-2);
  }
  #roster-table .roster-divider:hover { background: none; }
  tr.pickable { cursor: pointer; }
  tr.pickable.hl-good td { background: color-mix(in srgb, var(--warn) 38%, transparent); font-weight: 600; }
  tr.pickable.hl-great td { background: color-mix(in srgb, var(--good) 38%, transparent); font-weight: 600; }
  .mark-great { color: var(--good); }
  .mark-good { color: var(--warn); }

  .bye { color: var(--bad); font-size: 12px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--bad-bg); color: var(--bad); font-weight: 500; }

  .status-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 500; margin-right: 6px; }
  .status-badge.locked { background: var(--good-bg); color: var(--good); }
  .status-badge.win { background: #d4edd6; color: #1e7a2e; }
  .status-badge.loss { background: #f8d7d7; color: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .status-badge.win { background: #1f3a25; color: #7fd28a; }
    :root:not([data-theme="light"]) .status-badge.loss { background: #402122; color: #f08c86; }
  }
  :root[data-theme="dark"] .status-badge.win { background: #1f3a25; color: #7fd28a; }
  :root[data-theme="dark"] .status-badge.loss { background: #402122; color: #f08c86; }
  .status-badge.tentative { background: var(--warn-bg); color: var(--warn); }

  .rule-alert { background: var(--bad-bg); color: var(--bad); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 12px; font-size: 13px; }
  .rule-alert ul { margin: 4px 0 0; padding-left: 18px; }

  button {
    cursor: pointer; padding: 9px 14px; min-height: 38px; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; font-weight: 500;
    background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:active { opacity: 0.8; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #generate-schedule, .btn-primary {
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
  }
  #generate-schedule:hover, .btn-primary:hover { opacity: 0.9; color: var(--accent-ink); }

  input[type=text], select {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px;
    background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px;
  }
  .field { margin-bottom: 10px; display: flex; align-items: center; gap: 4px; }
  p[id$="-status"], #data-updated-at { font-size: 13px; color: var(--text-2); min-height: 1.2em; }

  #week-label { font-family: 'Oswald', sans-serif; font-size: 18px; letter-spacing: 0.03em; margin: 0 8px; }
  #week-prev, #week-next { padding: 6px 10px; }
  #window-badge:not(:empty) {
    display: inline-block; margin-left: 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em;
    background: var(--warn-bg); color: var(--warn); padding: 3px 9px; border-radius: 999px; font-family: 'IBM Plex Sans', sans-serif; font-weight: 500;
  }
  #own-score { background: var(--surface-2); margin-bottom: 1.25rem; }

  @media (max-width: 600px) {
    /* Drop Slot and Weekly Proj. columns to fit Player/Opp/Position/3D
       Value/Bye as a real table with no horizontal scroll. Weekly Proj. is
       dropped (not just hidden) since it's virtually always blank until
       DraftSharks publishes weekly numbers — 3D Value is the number that
       matters until then. Opp stays even on mobile since it's short (e.g.
       "@DAL"). */
    #roster-table th:nth-child(1), #roster-table td:nth-child(1),
    #roster-table th:nth-child(6), #roster-table td:nth-child(6) { display: none; }
    #roster-table th, #roster-table td { padding: 6px 4px; font-size: 12px; }
    /* Comfortable tap targets on touch screens (44px is the standard
       accessibility minimum) without bulking up the desktop layout. */
    button { min-height: 44px; padding: 10px 16px; }
    #week-prev, #week-next { padding: 10px 14px; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<div id="app">
  <div class="tabs">
    <button class="tab active" data-tab="picker">Weekly picker</button>
    <button class="tab" data-tab="rosters">Rosters</button>
    <button class="tab" data-tab="freeagents">Free agents</button>
    <button class="tab" data-tab="overview">Season overview</button>
  </div>
  <p id="sync-status"></p>
  <p id="data-updated-at"></p>

  <div class="panel active" id="panel-picker">
    <div class="field">
      <button id="week-prev">&larr;</button>
      <strong id="week-label">Week 1</strong>
      <button id="week-next">&rarr;</button>
      <span id="window-badge"></span>
    </div>
    <div id="own-score" class="card"></div>
    <div id="opponent-list" class="card-grid"></div>
  </div>

  <div class="panel" id="panel-rosters">
    <div class="field">
      <button id="roster-prev">&larr;</button>
      <strong id="roster-team-label">Me</strong>
      <button id="roster-next">&rarr;</button>
    </div>
    <table id="roster-table">
      <thead><tr><th>Slot</th><th>Player</th><th>Opp</th><th>Position</th><th>3D Value</th><th>Weekly Proj.</th><th>Bye</th></tr></thead>
      <tbody></tbody>
    </table>
    <div id="weekly-viewer"></div>
  </div>

  <div class="panel" id="panel-freeagents">
    <p class="weekly-note" id="fa-note"></p>
    <div id="fa-lineup"></div>
    <div id="fa-table-wrap"></div>
  </div>

  <div class="panel" id="panel-overview">
    <button id="generate-schedule">Generate / refresh season schedule</button>
    <div id="schedule-violations"></div>
    <table id="overview-table">
      <thead><tr><th>Week</th><th>Opponent</th><th>Status</th><th>Player stolen</th></tr></thead>
      <tbody></tbody>
    </table>
    <h4>Meetings so far</h4>
    <table id="meetings-table">
      <thead><tr><th>Team</th><th>Times played</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
/* LOGIC_INJECTION_POINT */
</script>
<script>
(function () {
  // These two teams have already met their max meetings for the season with
  // both matchups locked in for good (see vampire_schedule) -- Jared
  // considers that history sealed, so the Unlock button is hidden for them
  // rather than left available just because the general schedule rules
  // wouldn't technically block re-opening it.
  const PERMANENTLY_LOCKED_TEAMS = ['Ray', 'Sandusky'];

  // NFL weeks roll over on Tuesday (matches in-season/src/season_config.py:
  // WEEK_1_TUESDAY needs a one-line update each season). Computed in the
  // browser so the page switches weeks at local Tuesday midnight instead of
  // waiting on a scheduled job.
  function computeCurrentWeek(lastWeek) {
    const week1Tuesday = new Date(2026, 8, 8);
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const week = Math.floor(Math.round((today - week1Tuesday) / 86400000) / 7) + 1;
    return Math.max(1, Math.min(week, lastWeek));
  }

  const state = {
    rosters: {},
    draftsharks: {},
    settings: { lastRegularSeasonWeek: 13, restrictedWindowStart: 5, restrictedWindowEnd: 13, maxMeetingsPerOpponent: 2 },
    scheduleWeeks: [],
    currentWeek: computeCurrentWeek(13),
    rosterIndex: 0,
    dataUpdatedAt: null,
    lineupFlags: {},
    weeklyProjections: {},
    expandedWeeks: {},
    weeklyMetric: 'proj',
    highlighted: loadHighlights(),
    faSort: { key: 'proj', dir: 'desc' },
    rosProjections: {},
    whatIf: emptyWhatIf(),
    editingLineup: false,
    db: null,
  };

  // Dev-only: lets a local preview seed state without writing to Supabase.
  if (location.hostname === 'localhost') window.__vampireState = state;

  function $(id) { return document.getElementById(id); }

  function esc(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach((el) => el.classList.toggle('active', el.dataset.tab === name));
    document.querySelectorAll('.panel').forEach((el) => el.classList.toggle('active', el.id === 'panel-' + name));
    if (name === 'picker') renderPicker();
    if (name === 'overview') renderOverview();
    if (name === 'rosters') renderRosters();
    if (name === 'freeagents') renderFreeAgents();
  }

  document.querySelectorAll('.tab').forEach((el) => {
    el.addEventListener('click', () => switchTab(el.dataset.tab));
  });

  // Delegated so it keeps working after renderPicker() replaces the cards'
  // innerHTML on every week change / realtime update, without re-binding.
  $('panel-picker').addEventListener('click', (event) => {
    const row = event.target.closest('tr[data-player]');
    if (!row) return;
    toggleLineupFlag(Number(row.dataset.week), row.dataset.team, row.dataset.player);
  });

  function nonVampireTeams() {
    return Object.keys(state.rosters).filter((t) => t !== 'Me' && t !== findFreeAgentTeam(state.rosters));
  }

  // Shared by the "Me" card and every opponent card, so both show the same
  // per-player matchup detail (slot, this week's projection, 3D Value,
  // bye/out status and bench replacement) rather than the opponent side
  // alone -- lets you eyeball your own lineup's matchups, not just the
  // aggregate score, when deciding who to play.
  function lineupTableHTML(breakdown, benchTop, team) {
    return '<table class="card-lineup"><thead><tr><th>Slot</th><th>Player</th><th>Opp</th><th>Proj.</th><th>3D Value</th><th>Status</th></tr></thead>'
      + '<tbody>' + breakdown.map((p) => {
        const weeklyText = p.weeklyProjection !== null ? p.weeklyProjection.toFixed(1) : '—';
        // 3D Value is a season-long draft-day number -- once a player is
        // flagged out for the week, it's not relevant to this decision and
        // showing it next to "out" reads as if that's what they'd score.
        const threeDText = !p.isOut && p.threeDValue !== null ? p.threeDValue.toFixed(1) : '—';
        const oppText = p.opponent ? esc(p.opponent) : '—';
        let statusText = '';
        if (p.onBye) statusText = 'bye';
        else if (p.isOut) statusText = 'out';
        const statusClass = p.onBye || p.isOut ? ' class="bye"' : '';
        // Clicking a row cycles it default -> good -> injury -> bad -> default
        // (see toggleLineupFlag); the flag is keyed by week+team+player so it's
        // specific to this week's matchup call, not a standing note on the player.
        const flag = state.lineupFlags[lineupFlagKey(state.currentWeek, team, p.player)];
        const rowClass = flag ? ' class="flag-' + esc(flag) + '"' : '';
        return '<tr data-week="' + state.currentWeek + '" data-team="' + esc(team) + '" data-player="' + esc(p.player) + '"' + rowClass + '><td>' + esc(p.slot) + '</td><td>' + markHTML(p.player) + esc(p.player) + '</td><td>' + oppText + '</td><td>' + weeklyText + '</td>'
          + '<td>' + threeDText + '</td><td' + statusClass + '>' + statusText + '</td></tr>';
      }).join('')
      + (benchTop
        ? '<tr class="card-lineup-bench"><td>BENCH</td><td>' + markHTML(benchTop.player) + esc(benchTop.player) + '</td>'
          + '<td>' + (benchTop.opponent ? esc(benchTop.opponent) : '—') + '</td>'
          + '<td>' + (benchTop.weeklyProjection !== null ? benchTop.weeklyProjection.toFixed(1) : '—') + '</td>'
          + '<td>' + (benchTop.threeDValue !== null ? benchTop.threeDValue.toFixed(1) : '—') + '</td><td>top bench</td></tr>'
        : '')
      + '</tbody></table>';
  }

  function toggleLineupFlag(week, team, player) {
    const key = lineupFlagKey(week, team, player);
    const next = nextLineupFlag(state.lineupFlags[key]);
    if (next) {
      state.lineupFlags[key] = next;
    } else {
      delete state.lineupFlags[key];
    }
    renderPicker();
    syncLineupFlag(week, team, player, next);
  }

  async function syncLineupFlag(week, team, player, flag) {
    if (!state.db) return;
    const { error } = flag
      ? await state.db.from('vampire_lineup_flags').upsert({ week, team, player, flag })
      : await state.db.from('vampire_lineup_flags').delete().eq('week', week).eq('team', team).eq('player', player);
    $('sync-status').textContent = error ? 'Failed to save — check your connection and try again.' : '';
  }

  function renderPicker() {
    $('week-label').textContent = 'Week ' + state.currentWeek;
    $('window-badge').textContent = isRestrictedWeek(state.currentWeek, state.settings)
      ? 'restricted window · once each'
      : '';

    const me = state.rosters.Me || [];
    const myScore = teamWeekScore(me, state.draftsharks, state.currentWeek);
    const myBreakdown = teamWeekBreakdown(me, state.draftsharks, state.currentWeek);
    const myBenchTop = teamBenchTopPlayer(me, state.draftsharks, state.currentWeek);
    const myByePlayers = myBreakdown.filter((p) => p.onBye).map((p) => p.player).join(', ');
    $('own-score').innerHTML = '<div class="card-top">'
      + '<div class="card-eyebrow">Your team</div>'
      + '<div class="card-name">Me</div>'
      + '<div class="card-stats"><span class="card-score">' + myScore.toFixed(1) + '</span></div>'
      + '</div>'
      + (myByePlayers ? '<div class="card-strip bye"><strong>Bye:</strong> ' + esc(myByePlayers) + '</div>' : '')
      + lineupTableHTML(myBreakdown, myBenchTop, 'Me');

    const teams = nonVampireTeams().map((team) => {
      const players = state.rosters[team] || [];
      const score = teamWeekScore(players, state.draftsharks, state.currentWeek);
      const breakdown = teamWeekBreakdown(players, state.draftsharks, state.currentWeek);
      const benchTop = teamBenchTopPlayer(players, state.draftsharks, state.currentWeek);
      const reason = ineligibilityReason(team, state.currentWeek, state.scheduleWeeks, state.settings);
      return { team, score, breakdown, benchTop, reason };
    }).sort((a, b) => a.score - b.score);

    const topEligibleIndex = teams.findIndex((t) => !t.reason);
    const currentEntry = state.scheduleWeeks.find((w) => w.week === state.currentWeek);

    const list = $('opponent-list');
    list.innerHTML = '';
    teams.forEach((entry, index) => {
      const isLockedPick = !!(currentEntry && currentEntry.locked && currentEntry.opponent === entry.team);
      // An ineligible team is fully removed from the board, not just grayed
      // out -- once a team is used up for this stretch/season, it's not a
      // real option, so it shouldn't take up space. The exception is the
      // team already locked in for the week being viewed.
      if (entry.reason && !isLockedPick) return;
      const card = document.createElement('div');
      card.className = 'card' + (isLockedPick ? ' locked-in' : '');
      const byePlayers = entry.breakdown.filter((p) => p.onBye).map((p) => p.player).join(', ');
      const injuryValues = entry.breakdown.filter((p) => p.injuryRisk !== null).map((p) => p.injuryRisk);
      const avgInjuryRisk = injuryValues.length
        ? Math.round(injuryValues.reduce((sum, v) => sum + v, 0) / injuryValues.length)
        : null;
      const margin = (myScore - entry.score).toFixed(1);

      const top = document.createElement('div');
      top.className = 'card-top';
      top.innerHTML = (index === topEligibleIndex && !entry.reason ? '<div class="card-eyebrow">Weakest opponent</div>' : '<div class="card-eyebrow ph"></div>')
        + '<div class="card-name">' + esc(entry.team) + '</div>'
        + '<div class="card-stats"><span class="card-score">' + entry.score.toFixed(1) + '</span>'
        + '<span class="card-margin ' + (margin >= 0 ? 'good' : 'bad') + '">' + (margin >= 0 ? '+' : '') + margin + '</span></div>';
      card.appendChild(top);

      const strips = document.createElement('div');
      strips.className = 'card-strips';
      card.appendChild(strips);

      if (byePlayers) {
        const strip = document.createElement('div');
        strip.className = 'card-strip bye';
        strip.innerHTML = '<strong>Bye:</strong> ' + esc(byePlayers);
        strips.appendChild(strip);
      }
      if (avgInjuryRisk !== null && avgInjuryRisk >= 40 && !entry.reason) {
        const strip = document.createElement('div');
        strip.className = 'card-strip injury';
        strip.textContent = 'Injury risk: ' + avgInjuryRisk + '%';
        strips.appendChild(strip);
      }
      if (isLockedPick) {
        const strip = document.createElement('div');
        strip.className = 'card-strip locked-in';
        strip.textContent = 'Locked in for week ' + state.currentWeek;
        strips.appendChild(strip);
      }

      const detailsWrap = document.createElement('div');
      detailsWrap.innerHTML = lineupTableHTML(entry.breakdown, entry.benchTop, entry.team);
      card.appendChild(detailsWrap.firstChild);

      if (isLockedPick && PERMANENTLY_LOCKED_TEAMS.includes(entry.team)) {
        // No footer at all -- these matchups are locked in for good.
      } else if (isLockedPick) {
        const footer = document.createElement('div');
        footer.className = 'card-footer';
        const unlockButton = document.createElement('button');
        unlockButton.textContent = 'Unlock';
        unlockButton.addEventListener('click', (event) => {
          event.stopPropagation();
          unlockWeek(state.currentWeek);
        });
        footer.appendChild(unlockButton);
        card.appendChild(footer);
      } else if (!entry.reason) {
        const footer = document.createElement('div');
        footer.className = 'card-footer';
        const lockButton = document.createElement('button');
        lockButton.className = 'btn-primary';
        lockButton.textContent = 'Lock in ' + entry.team;
        lockButton.addEventListener('click', (event) => {
          event.stopPropagation();
          lockWeek(state.currentWeek, entry.team);
        });
        footer.appendChild(lockButton);
        card.appendChild(footer);
      }

      list.appendChild(card);
    });
  }

  function violationMessage(violation) {
    if (violation.type === 'repeated-in-window') {
      return esc(violation.team) + ' is scheduled ' + violation.weeks.length
        + ' times during weeks ' + state.settings.restrictedWindowStart + '–'
        + state.settings.restrictedWindowEnd + ' (weeks ' + violation.weeks.join(', ') + ') — must play each team exactly once in that window.';
    }
    if (violation.type === 'repeated-in-stretch') {
      return esc(violation.team) + ' is scheduled ' + violation.weeks.length
        + ' times in the same stretch of the season (weeks ' + violation.weeks.join(', ') + ') — must play each team at most once per stretch.';
    }
    return esc(violation.team) + ' is scheduled ' + violation.weeks.length
      + ' times this season (weeks ' + violation.weeks.join(', ') + '), over the max of '
      + state.settings.maxMeetingsPerOpponent + '.';
  }

  function renderScheduleViolations() {
    const container = $('schedule-violations');
    const violations = findScheduleViolations(state.scheduleWeeks, state.settings);
    if (violations.length === 0) {
      container.innerHTML = '';
      return;
    }
    container.innerHTML = '<div class="rule-alert"><strong>Schedule rule violation'
      + (violations.length > 1 ? 's' : '') + ':</strong><ul>'
      + violations.map((v) => '<li>' + violationMessage(v) + '</li>').join('')
      + '</ul></div>';
  }

  function renderOverview() {
    renderScheduleViolations();
    const tbody = document.querySelector('#overview-table tbody');
    tbody.innerHTML = '';
    for (let week = 1; week <= state.settings.lastRegularSeasonWeek; week += 1) {
      const entry = state.scheduleWeeks.find((w) => w.week === week) || { opponent: null, locked: false, result: null, note: '' };
      const tr = document.createElement('tr');

      const weekCell = document.createElement('td');
      weekCell.textContent = week;
      const opponentCell = document.createElement('td');
      opponentCell.textContent = entry.opponent || '—';
      const statusCell = document.createElement('td');
      if (entry.result === 'W' || entry.result === 'L') {
        // A played week shows its result in place of "locked".
        const resultBadge = document.createElement('span');
        resultBadge.className = 'status-badge ' + (entry.result === 'W' ? 'win' : 'loss');
        resultBadge.textContent = entry.result === 'W' ? 'Won' : 'Lost';
        statusCell.appendChild(resultBadge);
      } else if (entry.locked) {
        const statusBadge = document.createElement('span');
        statusBadge.className = 'status-badge locked';
        statusBadge.textContent = 'locked';
        statusCell.appendChild(statusBadge);
        // Weeks already played are final.
        if (week >= state.currentWeek && !PERMANENTLY_LOCKED_TEAMS.includes(entry.opponent)) {
          const unlockButton = document.createElement('button');
          unlockButton.textContent = 'Unlock';
          unlockButton.addEventListener('click', () => unlockWeek(week));
          statusCell.appendChild(unlockButton);
        }
      } else if (entry.opponent) {
        const statusBadge = document.createElement('span');
        statusBadge.className = 'status-badge tentative';
        statusBadge.textContent = 'tentative';
        statusCell.appendChild(statusBadge);
      }
      tr.appendChild(weekCell);
      tr.appendChild(opponentCell);
      const stolenCell = document.createElement('td');
      stolenCell.textContent = entry.result === 'W' ? (entry.note || '') : '';
      tr.appendChild(statusCell);
      tr.appendChild(stolenCell);

      tbody.appendChild(tr);
    }

    const counts = meetingCounts(state.scheduleWeeks);
    const meetingsBody = document.querySelector('#meetings-table tbody');
    meetingsBody.innerHTML = nonVampireTeams().map((team) => (
      '<tr><td>' + esc(team) + '</td><td>' + (counts[team] || 0) + '</td></tr>'
    )).join('');
  }

  // A roster row (starter or bench) is rendered the same way -- only the
  // Slot column differs (a real slot name for starters, "BENCH" for the
  // rest, which scoredRoster has already sorted by 3D Value).
  function rosterRowHTML(row, slotLabel) {
    const info = findPlayerInfo(row.player, state.draftsharks);
    const byeWeek = info && info.bye !== null && info.bye !== undefined ? info.bye : null;
    const onBye = byeWeek !== null && byeWeek === state.currentWeek;
    const threeD = row.threeDValue !== null ? row.threeDValue.toFixed(1) : '';
    const weekly = row.weeklyProjection !== null ? row.weeklyProjection.toFixed(1) : '';
    const opponentText = row.opponent ? esc(row.opponent) : (onBye ? 'BYE' : '—');
    return '<tr class="pickable' + (state.highlighted[row.player] ? ' hl-' + state.highlighted[row.player] : '') + '" data-player="' + esc(row.player) + '">'
      + '<td data-label="Slot">' + esc(slotLabel) + '</td>'
      + '<td data-label="Player">' + esc(row.player) + '</td>'
      + '<td data-label="Opp">' + opponentText + '</td>'
      + '<td data-label="Position">' + esc(row.position) + '</td>'
      + '<td data-label="3D Value">' + threeD + '</td>'
      + '<td data-label="Weekly Proj.">' + weekly + '</td>'
      + '<td data-label="Bye"' + (onBye ? ' class="bye"' : '') + '>' + (byeWeek !== null ? byeWeek : '') + (onBye ? ' (this week)' : '') + '</td>'
      + '</tr>';
  }

  // The viewer covers only the matchup-eligible stretch, weeks 5-13.
  const WEEKLY_VIEW_FIRST_WEEK = 5;
  const WEEKLY_VIEW_LAST_WEEK = 13;

  // Players marked on the Rosters page: 'good' (yellow) or 'great' (green).
  // Stored in Supabase (vampire_player_marks) so they follow you across
  // browsers/devices; localStorage is a fallback cache. Separate from the
  // week-specific lineup flags.
  const HIGHLIGHT_KEY = 'vampire-highlighted-players';
  function loadHighlights() {
    try {
      const saved = JSON.parse(localStorage.getItem(HIGHLIGHT_KEY)) || {};
      Object.keys(saved).forEach((name) => { if (saved[name] === true) saved[name] = 'good'; });
      return saved;
    } catch (e) { return {}; }
  }
  // Markers shown next to a name in the weekly lineups: star = great, diamond = good.
  function markHTML(player) {
    const level = state.highlighted[player];
    if (level === 'great') return '<span class="mark mark-great" title="Great">★</span> ';
    if (level === 'good') return '<span class="mark mark-good" title="Good">◆</span> ';
    return '';
  }
  function toggleHighlight(player) {
    const level = state.highlighted[player];
    if (!level) state.highlighted[player] = 'great';
    else if (level === 'great') state.highlighted[player] = 'good';
    else delete state.highlighted[player];
    try { localStorage.setItem(HIGHLIGHT_KEY, JSON.stringify(state.highlighted)); } catch (e) { /* storage unavailable */ }
    syncHighlight(player, state.highlighted[player]);
  }
  async function syncHighlight(player, level) {
    if (!state.db) return;
    const { error } = level
      ? await state.db.from('vampire_player_marks').upsert({ player, level })
      : await state.db.from('vampire_player_marks').delete().eq('player', player);
    $('sync-status').textContent = error ? 'Failed to save marks — check your connection and try again.' : '';
  }
  // Remote marks win; marks that exist only in this browser (made before the
  // table existed) are uploaded once so nothing is lost.
  async function loadHighlightsRemote(supabase) {
    const { data, error } = await supabase.from('vampire_player_marks').select('*');
    if (error) return error;
    const remote = {};
    (data || []).forEach((r) => { remote[r.player] = r.level; });
    const localOnly = Object.keys(state.highlighted).filter((n) => !remote[n]);
    if (data && data.length === 0 && localOnly.length) {
      await supabase.from('vampire_player_marks').upsert(localOnly.map((player) => ({ player, level: state.highlighted[player] })));
      return null;
    }
    state.highlighted = remote;
    try { localStorage.setItem(HIGHLIGHT_KEY, JSON.stringify(remote)); } catch (e) { /* storage unavailable */ }
    return null;
  }

  function fmt1(value) { return value == null ? '—' : Number(value).toFixed(1); }

  function byeText(list) {
    return list.map((p) => p.player + ' (' + p.position + ')').join(', ');
  }

  function weeklyDetailHTML(week) {
    const body = week.rows.map((r) => (
      '<tr' + (r.replacement ? ' class="stand-in"' : ' class="pickable" data-player="' + esc(r.player) + '"') + '>'
      + '<td>' + esc(r.slot) + '</td>'
      + '<td>' + (r.replacement ? 'Free agent (replacement level)' : markHTML(r.player) + esc(r.player)) + '</td>'
      + '<td>' + (r.opponent ? esc(r.opponent) : '—') + '</td>'
      + '<td>' + (r.estimated ? '~' : '') + fmt1(r.proj) + '</td>'
      + '<td>' + (r.threeDValue != null ? r.threeDValue.toFixed(1) : '—') + '</td>'
      + '</tr>'
    )).join('');
    const bye = (week.byePlayers.length
      ? '<p class="detail-bye">On bye: ' + esc(byeText(week.byePlayers)) + '</p>' : '')
      + (week.outPlayers.length
        ? '<p class="detail-bye">Out (no projection): ' + esc(byeText(week.outPlayers)) + '</p>' : '');
    return '<tr class="weekly-detail"><td colspan="3"><div class="detail-box">'
      + '<table class="card-lineup"><thead><tr><th>Slot</th><th>Player</th><th>Opp</th><th>DS Proj</th><th>3D Value</th></tr></thead>'
      + '<tbody>' + body + '</tbody></table>' + bye + '</div></td></tr>';
  }

  function renderWeeklyViewer(players) {
    const el = $('weekly-viewer');
    const startWeek = Math.max(state.currentWeek, WEEKLY_VIEW_FIRST_WEEK);
    if (startWeek > WEEKLY_VIEW_LAST_WEEK) {
      el.innerHTML = '<p class="weekly-note">No weeks left to show — matchups end after week ' + WEEKLY_VIEW_LAST_WEEK + '.</p>';
      return;
    }
    const faTeam = findFreeAgentTeam(state.rosters);
    const leagueRosters = {};
    Object.keys(state.rosters).forEach((t) => { if (t !== faTeam) leagueRosters[t] = state.rosters[t]; });
    const levels = replacementLevels(leagueRosters, state.draftsharks, state.weeklyProjections, startWeek, WEEKLY_VIEW_LAST_WEEK);
    const view = buildWeeklyView(players, state.draftsharks, state.weeklyProjections, {
      startWeek, endWeek: WEEKLY_VIEW_LAST_WEEK, levels,
    });
    const noData = view.weeks.length > 0 && view.weeks.every((w) => w.missing === w.rows.filter((r) => !r.replacement).length);
    const useThreeD = state.weeklyMetric === '3d';
    const metricOf = (w) => (useThreeD ? w.threeD : w.proj);
    const totals = view.weeks.map(metricOf);
    const lo = Math.min(...totals); const hi = Math.max(...totals);
    const rowsHTML = view.weeks.map((w) => {
      const open = !!state.expandedWeeks[w.week];
      const t = hi > lo ? (metricOf(w) - lo) / (hi - lo) : 0.5;
      const warn = w.missing > 0 ? ' <span class="bye" title="' + w.missing + ' starter(s) have no projection; estimated at replacement level">(' + w.missing + ' estimated)</span>' : '';
      const byes = w.byePlayers.length
        ? '<span class="bye-list" title="' + esc(byeText(w.byePlayers)) + '">' + esc(byeText(w.byePlayers)) + '</span>'
        : '<span class="bye-list">—</span>';
      return '<tr class="weekly-row' + (open ? ' open' : '') + '" data-week="' + w.week + '">'
        + '<td><span class="chev">' + (open ? '▾' : '▸') + '</span>Week ' + w.week + warn + '</td>'
        + '<td class="ds-cell" style="--t:' + t.toFixed(3) + '">' + metricOf(w).toFixed(1) + '</td>'
        + '<td>' + byes + '</td></tr>'
        + (open ? weeklyDetailHTML(w) : '');
    }).join('');

    const metricLabel = useThreeD ? '3D Value' : 'DS Proj';
    el.innerHTML = '<h3>Weekly lineups (weeks ' + startWeek + '–' + WEEKLY_VIEW_LAST_WEEK + ')</h3>'
      + '<div class="fa-toolbar"><span class="weekly-note" style="margin:0">Shade by:</span>'
      + '<button class="fa-btn" data-metric="proj"' + (useThreeD ? '' : ' disabled') + '>DS Proj</button>'
      + '<button class="fa-btn" data-metric="3d"' + (useThreeD ? ' disabled' : '') + '>3D Value</button></div>'
      + '<p class="weekly-note">Lineups are built from 3D value (who they would realistically start) and scored with DraftSharks projections. A position they cannot fill counts as a free agent at replacement level. The week total is shaded green (lowest week) to red (highest). Players with no DraftSharks projection in a published week are treated as out. Click a week to see the lineup; click a player to cycle green (great) / yellow (good) / off.</p>'
      + (noData ? '<p class="weekly-note">No weekly projections loaded yet — run <code>npm run refresh-weekly-all</code>.</p>' : '')
      + '<table id="weekly-table"><thead><tr><th>Week</th><th>' + metricLabel + '</th><th>On bye</th></tr></thead><tbody>' + rowsHTML + '</tbody></table>';
  }

  function fmt0(value) { return value == null ? '—' : String(Math.round(value)); }

  function slotPlayerCell(slot, player, assignment, positionOf, roster) {
    if (!state.editingLineup) {
      return player ? esc(player) : '<span class="weekly-note">— empty —</span>';
    }
    const options = roster
      .map((p) => p.player)
      .filter((name) => name === player || swapIntoSlot(assignment.slots, slot, name, positionOf))
      .map((name) => '<option value="' + esc(name) + '"' + (name === player ? ' selected' : '') + '>' + esc(name) + '</option>')
      .join('');
    return '<select class="fa-slot" data-slot="' + esc(slot) + '">' + options + '</select>';
  }

  function faLineupHTML(assignment, positionOf, week, roster) {
    const starters = LINEUP_SLOTS
      .filter((slot) => assignment.slots[slot])
      .map((slot) => ({ slot, player: assignment.slots[slot], position: positionOf(assignment.slots[slot]) }));
    const totals = lineupTotals(starters, state.weeklyProjections, week);
    const byPlayer = {};
    totals.rows.forEach((r) => { byPlayer[r.player] = r; });
    const body = LINEUP_SLOTS.map((slot) => {
      const player = assignment.slots[slot];
      const r = player ? byPlayer[player] : null;
      const info = player ? state.draftsharks[player] : null;
      const opp = r && r.opponent ? esc(r.opponent) : (info && info.bye === week ? 'BYE' : '—');
      return '<tr><td>' + esc(slot) + '</td>'
        + '<td>' + slotPlayerCell(slot, player, assignment, positionOf, roster) + '</td>'
        + '<td>' + opp + '</td>'
        + '<td class="num">' + fmt1(r && r.floor) + '</td>'
        + '<td class="num">' + fmt1(r && r.proj) + '</td>'
        + '<td class="num">' + fmt1(r && r.ceiling) + '</td></tr>';
    }).join('');
    const total = '<tr class="fa-lineup-total"><td colspan="3">Total</td>'
      + '<td class="num">' + totals.floor.toFixed(1) + '</td>'
      + '<td class="num">' + totals.proj.toFixed(1) + '</td>'
      + '<td class="num">' + totals.ceiling.toFixed(1) + '</td></tr>';
    const bench = assignment.bench.length
      ? '<p class="weekly-note">Bench: ' + assignment.bench.map(esc).join(', ') + '</p>' : '';
    return '<h3>My starting lineup (week ' + week + ')</h3>'
      + '<div class="fa-scroll"><table id="fa-lineup-table"><thead><tr><th>Slot</th><th>Player</th><th>Opp</th>'
      + '<th class="num">Floor</th><th class="num">DS Proj</th><th class="num">Ceiling</th></tr></thead><tbody>'
      + body + total + '</tbody></table></div>' + bench;
  }

  function faTableHTML(rows, week) {
    const body = rows.map((r) => {
      const cls = (r.mine ? 'fa-mine' : '') + (r.starter ? ' fa-starter' : '');
      return '<tr class="' + cls.trim() + '">'
        + '<td>' + esc(r.position) + '</td>'
        + '<td>' + esc(r.player) + (r.onBye ? ' <span class="bye">(bye)</span>' : '') + '</td>'
        + '<td class="num">' + fmt1(r.floor) + '</td>'
        + '<td class="num">' + fmt1(r.proj) + '</td>'
        + '<td class="num">' + fmt1(r.ceiling) + '</td>'
        + '<td class="num">' + fmt1(r.rosDsProj) + '</td>'
        + '<td class="num">' + fmt1(r.rosCeiling) + '</td>'
        + '<td class="num">' + fmt0(r.rosValue) + '</td>'
        + '<td><button class="fa-btn fa-move" data-player="' + esc(r.player) + '" data-mine="' + r.mine + '">'
        + (r.mine ? 'Drop' : 'Add') + '</button></td></tr>';
    }).join('');
    const wk = 'Wk ' + week + ' ';
    const cols = [
      ['position', 'Pos', false], ['player', 'Player', false],
      ['floor', wk + 'Floor', true], ['proj', wk + 'DS Proj', true], ['ceiling', wk + 'Ceiling', true],
      ['rosDsProj', 'ROS DS Proj', true], ['rosCeiling', 'ROS Ceiling', true], ['rosValue', 'ROS 3D Value', true],
    ];
    const head = cols.map(([key, label, num]) => {
      const active = state.faSort.key === key;
      const arrow = active ? (state.faSort.dir === 'asc' ? '▲' : '▼') : '';
      return '<th class="sortable' + (num ? ' num' : '') + '" data-sort="' + key + '"'
        + ' aria-sort="' + (active ? (state.faSort.dir === 'asc' ? 'ascending' : 'descending') : 'none') + '">'
        + label + ' <span class="arrow">' + arrow + '</span></th>';
    }).join('');
    return '<h3>FLEX players (RB / WR / TE)</h3>'
      + '<p class="weekly-note">Highlighted rows are on my roster; bold names are in my starting lineup. Click a column header to sort.</p>'
      + '<div class="fa-scroll"><table id="fa-table" class="fa-tight"><thead><tr>' + head + '<th></th>'
      + '</tr></thead><tbody>' + body + '</tbody></table></div>';
  }

  const WHATIF_KEY = 'vampire_fa_whatif';

  function currentSignature() {
    return rosterSignature(state.rosters.Me || [], state.rosters[findFreeAgentTeam(state.rosters)] || []);
  }

  function saveWhatIf() {
    try {
      localStorage.setItem(WHATIF_KEY, JSON.stringify({ sig: currentSignature(), whatIf: state.whatIf }));
    } catch (e) { /* storage unavailable: the what-if just won't survive a reload */ }
  }

  function loadWhatIf() {
    try {
      const saved = JSON.parse(localStorage.getItem(WHATIF_KEY) || 'null');
      if (saved && saved.sig === currentSignature()) return normalizeWhatIf(saved.whatIf);
    } catch (e) { /* fall through to an empty what-if */ }
    return emptyWhatIf();
  }

  function renderFreeAgents() {
    const base = state.rosters.Me || [];
    const pool = state.rosters[findFreeAgentTeam(state.rosters)] || [];
    const week = state.currentWeek;
    $('fa-note').textContent = pool.length
      ? 'What-if scratchpad: nothing here changes your league or rosters.csv. Make the real moves in your league, then update rosters.csv.'
      : 'No "Free Agents" team in rosters.csv yet. Add players with team "Free Agents" (or "FREE AGENT") to use this page.';

    const effective = effectiveRoster(base, pool, state.whatIf);
    const lookup = {};
    [...base, ...pool].forEach((p) => { lookup[p.player] = p.position; });
    const positionOf = (name) => lookup[name];
    const assignment = lineupAssignment(effective, state.draftsharks, week, state.whatIf);
    const rows = flexTableRows({
      base, pool, effective, starters: Object.values(assignment.slots).filter(Boolean),
      playerInfo: state.draftsharks, projections: state.weeklyProjections, ros: state.rosProjections, week,
    });

    const changes = state.whatIf.adds.map((n) => '+ ' + n).concat(state.whatIf.drops.map((n) => '− ' + n));
    const toolbar = '<div class="fa-toolbar">'
      + (changes.length ? '<span class="weekly-note">Changes: ' + changes.map(esc).join(', ') + '</span>' : '')
      + '<button class="fa-btn" id="fa-edit">' + (state.editingLineup ? 'Done editing' : 'Edit lineup') + '</button>'
      + (state.whatIf.manualLineup ? '<button class="fa-btn" id="fa-auto">Auto lineup</button>' : '')
      + (changes.length || state.whatIf.manualLineup ? '<button class="fa-btn" id="fa-reset">Reset</button>' : '')
      + '</div>';

    $('fa-lineup').innerHTML = toolbar + faLineupHTML(assignment, positionOf, week, effective);
    $('fa-table-wrap').innerHTML = faTableHTML(sortFlexRows(rows, state.faSort.key, state.faSort.dir), week);
  }

  function renderRosters() {
    const teamNames = ['Me', ...nonVampireTeams()];
    if (state.rosterIndex >= teamNames.length) state.rosterIndex = 0;
    const team = teamNames[state.rosterIndex];
    $('roster-team-label').textContent = team;

    const players = state.rosters[team] || [];
    const { starters, bench } = scoredRoster(players, state.draftsharks, state.currentWeek);
    const tbody = document.querySelector('#roster-table tbody');
    const starterRows = starters.map((row) => rosterRowHTML(row, row.slot)).join('');
    const divider = bench.length
      ? '<tr class="roster-divider"><td colspan="7">Bench</td></tr>'
      : '';
    const benchRows = bench.map((row) => rosterRowHTML(row, 'BENCH')).join('');
    tbody.innerHTML = starterRows + divider + benchRows;
    renderWeeklyViewer(players);
  }

  $('roster-prev').addEventListener('click', () => {
    const teamNames = ['Me', ...nonVampireTeams()];
    state.rosterIndex = (state.rosterIndex - 1 + teamNames.length) % teamNames.length;
    state.expandedWeeks = {};
    renderRosters();
  });
  $('roster-next').addEventListener('click', () => {
    const teamNames = ['Me', ...nonVampireTeams()];
    state.rosterIndex = (state.rosterIndex + 1) % teamNames.length;
    state.expandedWeeks = {};
    renderRosters();
  });

  // Click any player row (roster table or an expanded weekly lineup) to
  // highlight/unhighlight that player everywhere.
  document.addEventListener('click', (event) => {
    const row = event.target.closest('#panel-rosters tr.pickable');
    if (!row) return;
    toggleHighlight(row.dataset.player);
    renderRosters();
  });

  $('weekly-viewer').addEventListener('click', (event) => {
    const metricBtn = event.target.closest('button[data-metric]');
    if (metricBtn) {
      state.weeklyMetric = metricBtn.dataset.metric;
      renderRosters();
      return;
    }
    const row = event.target.closest('tr.weekly-row');
    if (row) {
      const week = Number(row.dataset.week);
      state.expandedWeeks[week] = !state.expandedWeeks[week];
      renderRosters();
    }
  });

  $('panel-freeagents').addEventListener('click', (event) => {
    const th = event.target.closest('th[data-sort]');
    if (th) {
      const key = th.dataset.sort;
      const textCol = key === 'position' || key === 'player';
      state.faSort = state.faSort.key === key
        ? { key, dir: state.faSort.dir === 'asc' ? 'desc' : 'asc' }
        : { key, dir: textCol ? 'asc' : 'desc' };
      renderFreeAgents();
      return;
    }
    const move = event.target.closest('.fa-move');
    if (move) {
      state.whatIf = toggleRosterMove(state.whatIf, move.dataset.player, move.dataset.mine === 'true');
      saveWhatIf();
      renderFreeAgents();
      return;
    }
    if (event.target.closest('#fa-edit')) {
      state.editingLineup = !state.editingLineup;
      renderFreeAgents();
      return;
    }
    if (event.target.closest('#fa-auto')) {
      state.whatIf = { ...state.whatIf, manualLineup: null };
      saveWhatIf();
      renderFreeAgents();
      return;
    }
    if (event.target.closest('#fa-reset')) {
      state.whatIf = emptyWhatIf();
      saveWhatIf();
      renderFreeAgents();
    }
  });

  $('panel-freeagents').addEventListener('change', (event) => {
    const select = event.target.closest('.fa-slot');
    if (!select) return;
    const base = state.rosters.Me || [];
    const pool = state.rosters[findFreeAgentTeam(state.rosters)] || [];
    const effective = effectiveRoster(base, pool, state.whatIf);
    const lookup = {};
    [...base, ...pool].forEach((p) => { lookup[p.player] = p.position; });
    const assignment = lineupAssignment(effective, state.draftsharks, state.currentWeek, state.whatIf);
    const next = swapIntoSlot(assignment.slots, select.dataset.slot, select.value, (n) => lookup[n]);
    if (next) {
      state.whatIf = { ...state.whatIf, manualLineup: next };
      saveWhatIf();
    }
    renderFreeAgents();
  });

  function lockWeek(week, opponent) {
    const updated = { week, opponent, locked: true, result: null, note: '' };
    const existingIndex = state.scheduleWeeks.findIndex((w) => w.week === week);
    if (existingIndex >= 0) state.scheduleWeeks[existingIndex] = updated;
    else state.scheduleWeeks.push(updated);
    renderPicker();
    if (state.db) {
      state.db.from('vampire_schedule').upsert({ week, opponent, locked: true }).then(({ error }) => {
        if (error) {
          console.error('Failed to lock week ' + week, error);
          $('sync-status').textContent = 'Failed to save — check your connection and try again.';
        } else {
          $('sync-status').textContent = '';
        }
      });
    }
  }

  function unlockWeek(week) {
    const index = state.scheduleWeeks.findIndex((w) => w.week === week);
    if (index < 0) return;
    state.scheduleWeeks[index] = { ...state.scheduleWeeks[index], locked: false };
    renderPicker();
    renderOverview();
    if (state.db) {
      state.db.from('vampire_schedule').upsert({ week, locked: false }).then(({ error }) => {
        if (error) {
          console.error('Failed to unlock week ' + week, error);
          $('sync-status').textContent = 'Failed to save — check your connection and try again.';
        } else {
          $('sync-status').textContent = '';
        }
      });
    }
  }

  $('week-prev').addEventListener('click', () => {
    state.currentWeek = Math.max(1, state.currentWeek - 1);
    renderPicker();
  });
  $('week-next').addEventListener('click', () => {
    state.currentWeek = Math.min(state.settings.lastRegularSeasonWeek, state.currentWeek + 1);
    renderPicker();
  });

  $('generate-schedule').addEventListener('click', async () => {
    const teams = nonVampireTeams();
    const generated = generateSeasonSchedule(teams, state.settings, state.scheduleWeeks);
    state.scheduleWeeks = generated.map((entry) => {
      const prev = state.scheduleWeeks.find((w) => w.week === entry.week);
      return prev ? { result: prev.result, note: prev.note, ...entry } : entry;
    });
    if (state.db) {
      const { error } = await state.db.from('vampire_schedule').upsert(generated.map((entry) => ({
        week: entry.week, opponent: entry.opponent, locked: entry.locked,
      })));
      if (error) {
        console.error('Failed to save generated schedule', error);
        $('sync-status').textContent = 'Failed to save — check your connection and try again.';
      } else {
        $('sync-status').textContent = '';
      }
    }
    renderOverview();
  });

  const SUPABASE_URL = 'https://tdtchffawcmkvgrccjza.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_7T_APoP6DNIpgI5QOsaY0g_qs_uhsRs';

  function rowsToRosters(rows) {
    const rosters = {};
    for (const row of rows) {
      if (!rosters[row.team]) rosters[row.team] = [];
      rosters[row.team].push({ player: row.player, position: row.position });
    }
    return rosters;
  }

  function rowsToPlayerValues(rows) {
    const players = {};
    for (const row of rows) {
      players[row.player] = {
        team: row.team, position: row.position, bye: row.bye,
        injuryRisk: row.injury_risk, threeDValue: row.three_d_value, weeklyProjection: row.weekly_projection,
        weeklyProjectionWeek: row.weekly_projection_week,
        weeklyProjectionNext: row.weekly_projection_next,
        weeklyProjectionNextWeek: row.weekly_projection_next_week,
        weeklyOpponent: row.weekly_opponent,
        weeklyOpponentNext: row.weekly_opponent_next,
      };
    }
    return players;
  }

  function rowToScheduleWeek(row) {
    return { week: row.week, opponent: row.opponent, locked: row.locked, result: row.result, note: row.note || '' };
  }

  async function loadRosters(supabase) {
    const { data, error } = await supabase.from('vampire_rosters').select('*');
    state.rosters = rowsToRosters(data || []);
    return error;
  }
  async function loadPlayerValues(supabase) {
    const { data, error } = await supabase.from('vampire_player_values').select('*');
    state.draftsharks = rowsToPlayerValues(data || []);
    return error;
  }
  async function loadSettings(supabase) {
    const { data, error } = await supabase.from('vampire_settings').select('*').single();
    if (data) {
      state.settings = {
        lastRegularSeasonWeek: data.last_regular_season_week,
        restrictedWindowStart: data.restricted_window_start,
        restrictedWindowEnd: data.restricted_window_end,
        maxMeetingsPerOpponent: data.max_meetings_per_opponent,
      };
      state.dataUpdatedAt = data.data_updated_at || null;
    }
    return error;
  }

  function renderDataUpdatedAt() {
    const el = $('data-updated-at');
    if (!el) return;
    if (!state.dataUpdatedAt) { el.textContent = ''; return; }
    const formatted = new Date(state.dataUpdatedAt).toLocaleString(undefined, {
      month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
    });
    el.textContent = 'Data last updated: ' + formatted;
  }
  async function loadSchedule(supabase) {
    const { data, error } = await supabase.from('vampire_schedule').select('*').order('week');
    state.scheduleWeeks = (data || []).map(rowToScheduleWeek);
    return error;
  }

  // Supabase returns at most 1000 rows per request; page until a short page.
  async function fetchAll(supabase, table, orderColumns) {
    const rows = [];
    const PAGE = 1000;
    for (let from = 0; ; from += PAGE) {
      let query = supabase.from(table).select('*');
      for (const column of orderColumns) query = query.order(column);
      const { data, error } = await query.range(from, from + PAGE - 1);
      if (error) return { error, rows: [] };
      rows.push(...data);
      if (data.length < PAGE) break;
    }
    return { error: null, rows };
  }

  async function loadWeeklyProjections(supabase) {
    const { error, rows } = await fetchAll(supabase, 'vampire_weekly_projections', ['player', 'week']);
    if (!error) state.weeklyProjections = rowsToWeeklyProjections(rows);
    return error;
  }

  async function loadRosProjections(supabase) {
    const { error, rows } = await fetchAll(supabase, 'vampire_ros_projections', ['player']);
    if (!error) state.rosProjections = rowsToRos(rows);
    return error;
  }

  async function loadLineupFlags(supabase) {
    const { data, error } = await supabase.from('vampire_lineup_flags').select('*');
    state.lineupFlags = rowsToLineupFlags(data || []);
    return error;
  }

  async function init() {
    if (typeof window.supabase === 'undefined') {
      renderPicker();
      renderOverview();
      return;
    }
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    state.db = supabase;

    const errors = await Promise.all([
      loadRosters(supabase),
      loadPlayerValues(supabase),
      loadSettings(supabase),
      loadSchedule(supabase),
      loadLineupFlags(supabase),
      loadHighlightsRemote(supabase),
      loadWeeklyProjections(supabase),
      loadRosProjections(supabase),
    ]);
    $('sync-status').textContent = errors.some(Boolean)
      ? 'Could not load the latest data — check your connection and reload.'
      : '';
    renderDataUpdatedAt();
    state.whatIf = loadWhatIf();
    renderPicker();
    renderRosters();
    renderFreeAgents();
    renderOverview();

    supabase.channel('vampire_schedule_changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'vampire_schedule' }, async () => {
        await loadSchedule(supabase);
        renderPicker();
        renderOverview();
      })
      .subscribe();

    supabase.channel('vampire_player_marks_changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'vampire_player_marks' }, async () => {
        await loadHighlightsRemote(supabase);
        renderPicker();
        renderRosters();
      })
      .subscribe();

    supabase.channel('vampire_lineup_flags_changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'vampire_lineup_flags' }, async () => {
        await loadLineupFlags(supabase);
        renderPicker();
      })
      .subscribe();
  }

  init();
})();
</script>
</body>
</html>
